policy:                                                       # first trial
  backbone: HuggingFaceTB/SmolVLM2-500M-Video-Instruct@7b375e1b73b11138ff12fe22c8f2822d8fe03467   # [verified] locked in Backbone_Trials.json
  code: policy/ (common.py prompt + window, smolvlm2.py inputs/model, data.py samples); trainer tools/train_policy_sft.py
  context_limit_tokens: 8192                                  # [verified] text_config.max_position_embeddings; 32 decoder layers
  hidden_width: 960                                           # spec §7
  trainable: decoder LoRA adapters only                       # spec §2
  frozen: [language weights, vision encoder, multimodal projector]
  lora: {targets: 'text_model.*.(q|k|v|o|gate|up|down)_proj', rank: 16, alpha: 32, dropout: 0.05}   # targets [verified]; rank/alpha/dropout [proposed]; 8.7M trainable params, fp32 adapters under bf16 autocast
  response_format: "' <ACTION><end_of_utterance>' after 'Assistant:', ACTION in {STOP, FORWARD, LEFT, RIGHT}"   # [proposed]; 3-4 supervised tokens; boundary tokenization [verified]
  decoding: four first-token action logits, selected-reference STOP bias, then argmax; one step per forward (batch 1) # reference decoder below is part of policy identity
  sample: one (episode, t) per step; executed actions before t in the prompt, target expert_action[t]; episodes whose expert replay fails are excluded and listed per run   # [proposed]
  history_window: {past_frames: 7, frame_sampling: uniform, recent_actions: 16}   # [proposed] W_i: up to 7 earlier views spread over the whole past (always incl. t-1) + current view; last 16 executed actions as text; 64 tokens/frame
  image_processor: native SmolVLM2 processor (512px, mean/std 0.5), do_image_splitting=false   # [proposed] splitting turns a 640x480 frame into many tiles; check_policy_step.py records tokens/frame
  optimizer: {name: AdamW, lr: 2.0e-4, weight_decay: 0.0, schedule: cosine, warmup_frac: 0.03, clip: 1.0}   # [proposed] not tuned
  loss_normalisation: summed target-token CE / target tokens per optimizer step (across grad-accum micro-batches)   # spec section 2
  microbatch: 16                                              # [measured 2026-10-23] H100 GPU 0; 24 data workers; 37.3 GiB peak in 80-update profile
  gradient_accumulation: 4                                    # effective batch 64
  sft_budget: {updates: 4096, samples: 262144, passes: 0.118137} # [adopted pilot] 21.11 samples/s; full pass 29.2 h, chosen budget ~3.5 h + validation/evaluation
