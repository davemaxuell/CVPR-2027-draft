# Vanilla baseline — experiment manifest (Step 1 of Vanilla_Training.md)
# Every value is tagged:
#   [verified]  checked against local files or the pinned upstream source
#   [confirmed] chosen by the user
#   [proposed]  default chosen during preparation; confirm or replace before Step 2
#   [TBD]       requires profiling or a decision; must be filled before the stage that uses it
manifest_version: 0.1-draft
created: 2026-10-23
first_trial: {policy: smolvlm2, world_model: dino_features}   # implementation order, per spec
# Trial definitions live in manifest/Backbone_Trials.json (locked) and manifest/World_Model_Trials.json (agreed); copied here for reference.
trials:
  policy:                                                     # [verified] Backbone_Trials.json, locked 2026-10-23
    smolvlm2: {repo: HuggingFaceTB/SmolVLM2-500M-Video-Instruct, revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467, width: 960}
    onevision: {repo: lmms-lab/llava-onevision-qwen2-0.5b-ov, revision: 381d9947148efb1e58a577f451c05705ceec666e, width: 896}   # native LlavaQwenForCausalLM, not an HF class
    qwen3vl: {repo: Qwen/Qwen3-VL-2B-Instruct, revision: 89644892e4d85e24eaac8bacfd4f463576704203, width: 2048}
  world_model:                                                # World_Model_Trials.json; checkpoints still open there
    dinowm_transfer: {family: dino_features, source_tasks: [PointMaze, PushT, Wall], checkpoint: TBD}
    dinov2_fresh_dynamics: {family: dino_features, note: same predictor architecture as dinowm_transfer}
    nwm_transfer: {family: cdit_vae, repo: "facebook/nwm (gated; access approved 2026-10-23)", candidate: cdit_s_100000.pth.tar (CDiT-S/2), vae: stabilityai/sd-vae-ft-ema}
    nwm_cdit_s_file: /data/shared/hf_cache/hub/models--facebook--nwm/snapshots/0821a1a7b1ae938539e32f13f5ad82465e0f3fde/cdit_s_100000.pth.tar   # [verified] downloaded 2026-10-23, 788,002,948 bytes; not yet loaded
    cdit_fresh_dynamics: {family: cdit_vae, note: same CDiT size and VAE as nwm_transfer}

datasets:
  data_root: /data/team_a/dave-workspace/RoleVLN/data
  r2r_ce:
    release: R2R_VLNCE_v1-3_preprocessed                     # [verified] train 10,819 / val_unseen 1,839 episodes
    expert: "{split}/{split}_gt.json.gz (actions, locations, forward_steps)"   # [verified] present for train
  rxr_ce:
    release: RxR_VLNCE_v0                                     # [verified]
    roles: [guide]                                            # [confirmed 2026-10-23] follower episodes excluded from the pilot
    languages: [en-US, en-IN]                                 # [confirmed 2026-10-23] English only
    expert: "{split}/{split}_guide_gt.json.gz"                # [verified]
  excluded: [EnvDrop augmentation, val_seen, test, ScaleVLN/HM3D]   # [proposed] CE-only pilot, less data than full benchmark
  scenes: scene_datasets/mp3d (90 scans, .glb + .navmesh)    # [verified]
  expert_lengths: {r2r_train_p50: 56, r2r_train_max: 183, rxr_en_guide_train_p50_15deg: 113, rxr_en_guide_train_max_15deg: 627, rxr_en_guide_val_unseen_max_15deg: 437}  # [verified] steps after splitting RxR turns
  rxr_instruction_words: {p50: 87, p95: 201, max: 581}       # [verified] check against policy context in Step 2

scene_partition:
  file: manifest/scene_partition.json                         # [adopted] generated by tools/make_scene_partition.py, seed 0
  summary:                                                    # episodes = R2R-CE + RxR-CE(en guide)
    A: {scenes: 44, r2r: 7489, rxr: 14132}
    B: {scenes: 9,  r2r: 1562, rxr: 2637}
    C: {scenes: 8,  r2r: 1768, rxr: 3227}
    E: {scenes: 11, r2r: 1839, rxr: 3669}                     # official val_unseen; identical scene set for both datasets
  note: Implements the pilot split described in Scorer_Design.md section 4 (no scene list existed). 61 train scenes -> A/B/C by episode share 0.70/0.15/0.15.

simulator:
  habitat_sim: 0.2.4 headless withbullet                      # [confirmed 2026-10-23] StreamVLN stack
  habitat_lab: v0.2.4                                         # [confirmed 2026-10-23]
  env: conda `rolevln` (env/setup_env.sh)
  rgb: {width: 640, height: 480, hfov: 79}                    # [verified] StreamVLN config/vln_r2r.yaml @ e48f6ff
  depth: {width: 640, height: 480, hfov: 79, min: 0.0, max: 10.0}   # [verified] same source; unused by the vanilla models
  rgb_sensor_position_m: [0.0, 1.25, 0.0]                     # [verified] live habitat-lab v0.2.4 config; agent height 1.5
  forward_step_m: 0.25                                        # [verified] StreamVLN config
  turn_angle_deg: 15                                          # [verified] StreamVLN config; [confirmed 2026-10-23] used for both R2R-CE and RxR-CE
  allow_sliding: true                                         # [verified] habitat-lab v0.2.4 default (not overridden by StreamVLN)
  success_distance_m: 3.0                                     # [verified] StreamVLN config
  max_episode_steps: {r2r: 500, rxr: 700}                     # this is B_max per task. r2r [verified] StreamVLN config; rxr [confirmed 2026-10-23] covers the longest 15-degree RxR expert (627)
  gt_replay_check: logs/check_ce_replay_r2r.json              # [verified] 20/20 group-A R2R-CE experts (11 scenes) succeed, 0.0 m location deviation
  rxr_expert_turn_angle_deg: 30                               # [verified] RxR-CE *_gt actions assume 30-degree turns: 4/20 succeed at 15, 20/20 at 30 or with each turn split into two 15s (max drift 0.27 m either way)
  rxr_turn_handling: unified_15                               # [confirmed 2026-10-23] StreamVLN-style single action space; each RxR expert turn becomes two 15-degree turns (sim/config.load_expert). RxR results are not on the official 30-degree RxR-CE protocol; say so when reporting
  render_gpu: 0                                               # [verified] only CUDA 0 is an EGL device for this account (not in video/render groups)

actions:
  internal_ids: {FORWARD: 0, LEFT: 1, RIGHT: 2, STOP: 3, START: 4}   # [verified] Scorer/config.json canonical_action_ids
  live_task_ids: {STOP: 0, FORWARD: 1, LEFT: 2, RIGHT: 3}     # [verified] live task order [stop, move_forward, turn_left, turn_right]; gt files use the same IDs
  internal_to_live: {0: 1, 1: 2, 2: 3, 3: 0}                  # the IDs differ: always go through Scorer ActionMap
  schedule: one primitive action per policy response, one action per env step   # spec §1
  world_model_transition: one executed CE command (no source-dataset frame skip)  # spec §1

policy:                                                       # first trial
  backbone: HuggingFaceTB/SmolVLM2-500M-Video-Instruct@7b375e1b73b11138ff12fe22c8f2822d8fe03467   # [verified] locked in Backbone_Trials.json
  code: policy/ (common.py prompt + window, smolvlm2.py inputs/model, data.py samples); trainer tools/train_policy_sft.py
  context_limit_tokens: 8192                                  # [verified] text_config.max_position_embeddings; 32 decoder layers
  hidden_width: 960                                           # spec §7
  trainable: decoder LoRA adapters only                       # spec §2
  frozen: [language weights, vision encoder, multimodal projector]
  lora: {targets: 'text_model.*.(q|k|v|o|gate|up|down)_proj', rank: 16, alpha: 32, dropout: 0.05}   # targets [verified]; rank/alpha/dropout [proposed]; 8.7M trainable params, fp32 adapters under bf16 autocast
  response_format: "' <ACTION><end_of_utterance>' after 'Assistant:', ACTION in {STOP, FORWARD, LEFT, RIGHT}"   # [proposed]; 3-4 supervised tokens; boundary tokenization [verified]
  decoding: argmax over the four actions' first-token logits at the prompt end, one step per forward (batch 1)   # [proposed]; first tokens are distinct [verified]; equals training-time prompt-end scores exactly [verified]; batching shifts logits <=0.125 (bf16)
  sample: one (episode, t) per step; executed actions before t in the prompt, target expert_action[t]; episodes whose expert replay fails are excluded and listed per run   # [proposed]
  history_window: {past_frames: 7, frame_sampling: uniform, recent_actions: 16}   # [proposed] W_i: up to 7 earlier views spread over the whole past (always incl. t-1) + current view; last 16 executed actions as text; 64 tokens/frame
  image_processor: native SmolVLM2 processor (512px, mean/std 0.5), do_image_splitting=false   # [proposed] splitting turns a 640x480 frame into many tiles; check_policy_step.py records tokens/frame
  optimizer: {name: AdamW, lr: 2.0e-4, weight_decay: 0.0, schedule: cosine, warmup_frac: 0.03, clip: 1.0}   # [proposed] not tuned
  loss_normalisation: summed target-token CE / target tokens per optimizer step (across grad-accum micro-batches)   # spec section 2
  microbatch: 16                                              # [measured 2026-10-23] H100 GPU 0; 24 data workers; 37.3 GiB peak in 80-update profile
  gradient_accumulation: 4                                    # effective batch 64
  sft_budget: {updates: 4096, samples: 262144, passes: 0.118137} # [adopted pilot] 21.11 samples/s; full pass 29.2 h, chosen budget ~3.5 h + validation/evaluation
  sft_run: runs/step2_smolvlm2                                 # tools/run_step2.py; completed status.json and RESULTS.md
  sft_status: complete                                        # partial-pass pilot completed 2026-10-23
  sft_selected_checkpoint: runs/step2_smolvlm2/train/checkpoints/step_003072
  sft_selected_metrics: {group: C, episodes: 64, success: 0.0625, spl: 0.04723891470806945, offline_action_accuracy: 0.764}
  sft_validation: {group: C, rendered_episodes: 600, usable_episodes: 596, offline_steps: 2000, eval_every: 512}
  sft_checkpoint_selection: {group: C, episodes_per_dataset: 32, checkpoints: [1024, 2048, 3072, 4096], criterion: 'macro success, then macro SPL, then offline CE'}
  dagger:                                                   # [adopted 2026-10-24] one pilot collection/refinement round
    rounds: 1
    run: runs/step3_smolvlm2
    expert_rule: ordered_reference_waypoints_v1
    reference: actual positions from validated group-A expert replays
    progress: monotonic; advance consecutive waypoints only within 0.5 m geodesic distance
    final_stop_radius_m: 1.0
    beta: 0.0                                               # learned policy executes every action
    episodes_per_dataset: 128                              # scene balanced; R2R 44 buildings, RxR 42
    collection_seed: 1
    refinement: {updates: 2048, microbatch: 16, gradient_accumulation: 4, lr: 5.0e-5, expert_fraction: 0.5, seed: 1}
    selection: {group: C, episodes_per_dataset: 32, checkpoints: [512, 1024, 1536, 2048], include_sft_parent: true}

world_model:                                                  # first trial: DINO branch (5A)
  encoder: facebook/dinov2-small@ed25f3a31f01632728cabb09d1542f84ab7b0056 (DINOv2-S/14)   # [proposed]
  preprocessing: resize/crop 224, mean/std 0.5, resize 196    # spec §5A
  patches: 196 x 384; pooled 2x2 -> 49 x 384
  history_frames: 1..3
  command_embedding_dim: 10
  proprio_channels: 10                                        # zero-valued
  predictor_channels: 404
  transfer_checkpoint: TBD                                    # [TBD] World_Model_Trials.json open decision; PointMaze/PushT/Wall sources
  optimizer: TBD
  budget: TBD
  precision: TBD

scorer:
  code: Scorer/ (config version scorer_v2_2026-10-23)        # [verified] unchanged from the Windows checks except scorer.py (below)
  py39_compat: "scorer.py gained `from __future__ import annotations` (its Tensor | None hints need 3.10+); applied 2026-10-23 with approval"
  design_checks: Scorer/check_results.json                   # [verified] 13/13 pass on rolevln (py3.9.23, torch 2.8.0+cu128); same parameter counts; Windows run kept as check_results.windows.json
  compatibility_checks: Scorer/compatibility_results.json      # [verified] 10/10 groups pass on rolevln; reads third_party/ and manifest/source_pins.json
  starting: {width: 256, memory_slots: 8, blocks: 2, heads: 4, readout: 128, lr: 1.0e-4, wd: 0.01, roots_per_batch: 8, clip: 1.0, bptt: 32}
  utility: {S: 0.70, N: 0.30, steps: -0.01, collisions: -0.02}

seeds: {partition: 0, training: 0, collection: 0}             # [proposed]
override_margin: null                                         # spec §9: base action until selected on C
