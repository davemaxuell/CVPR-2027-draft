defaults:
  - train: crossent_byol_vaml
  - algo: base_mad_td
  - env: dmc
  - models: td_mpc2
  - logger: wandb
  - override hydra/launcher: submitit_slurm
  - _self_

debug: False
name: mad_td
name_template: "{critic}-{mpc}-{mb}-{model-loss-short}-{mfenc}"

restart_from_wandbid: ""

cluster_checkpointing: True
alt_path:

train:
  tqdm_interval: 1000000

hydra:
  job:
    chdir: True
    env_set:
      MUJOCO_GL: glfw
  launcher:
    timeout_min: 480
    max_num_timeout: 100
    submitit_folder: 
    qos: m2
    gres: gpu:1
    partition: rtx6000,a40,t4v2
    mem_gb: 64
    cpus_per_task: 16