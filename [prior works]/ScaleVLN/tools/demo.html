<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScaleVLN · Navigation demonstration</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101719;color:#eaf2ee}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1440px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:28px;margin:0}p{line-height:1.6}small,.muted{color:#a1b7ad}select,button{font:inherit;background:#20332c;color:#fff;border:1px solid #526b60;border-radius:8px;padding:10px;cursor:pointer}button:hover,button:focus-visible{background:#315043}button:disabled{opacity:.4;cursor:default}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:24px}.card{background:#182421;border:1px solid #33493f;border-radius:16px;overflow:hidden}.inside{padding:20px}.photo{width:100%;height:430px;object-fit:contain;display:block;background:#080e0b}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}input{flex:1;min-width:100px;accent-color:#a2e8ac}#instruction{font-size:20px;min-height:90px}.badge{font-size:12px;letter-spacing:1px;color:#b9eea7}.stats{display:flex;gap:24px;margin:18px 0}.stats strong{font-size:24px;display:block}svg{width:100%;height:330px;background:#14201b;border-radius:10px}.legend{display:flex;gap:15px;font-size:13px;margin:12px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.reference{background:#c7af7f}.predicted{background:#b2efa1}.current{background:#f28469}footer{margin-top:22px;font-size:12px;color:#91a69a;line-height:1.8}@media(max-width:900px){body{padding:16px}.layout{grid-template-columns:1fr}.photo{height:330px}header{align-items:start;gap:12px;flex-direction:column}}
</style>
<header><div><div class="badge">VISION & LANGUAGE NAVIGATION</div><h1>ScaleVLN demonstration</h1></div><label>Episode <select id="episodes" aria-label="Choose episode"></select></label></header>
<main class="layout"><section class="card"><img class="photo" id="photo" alt="Matterport scene at the current predicted viewpoint"><div class="inside"><div class="controls"><button id="previous" aria-label="Previous navigation step">←</button><button id="play">Play</button><button id="next" aria-label="Next navigation step">→</button><input id="step" type="range" min="0" value="0" aria-label="Navigation step"><span id="counter"></span></div><p><label>Scene view <select id="face" aria-label="Choose skybox face"><option value="1">Wall 1</option><option value="2">Wall 2</option><option value="3">Wall 3</option><option value="4">Wall 4</option><option value="0">Ceiling</option><option value="5">Floor</option></select></label></p><small>Photographs at each visited viewpoint. View direction can be explored independently of the agent.</small></div></section>
<section class="card inside"><div class="badge" id="model"></div><p id="instruction"></p><div class="stats"><div><strong id="success"></strong><small>Episode result</small></div><div><strong id="error"></strong><small>Final distance to goal</small></div></div><svg id="map" role="img" aria-label="Top-down navigation graph showing reference and predicted paths" viewBox="0 0 500 330"></svg><div class="legend"><span><i class="dot reference"></i>Reference</span><span><i class="dot predicted"></i>Predicted</span><span><i class="dot current"></i>Current</span></div><small id="identity"></small></section></main>
<footer id="provenance"></footer>
<script id="demo-data" type="application/json">__DEMO_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('demo-data').textContent), $=id=>document.getElementById(id);
let episode=0,step=0,timer=null;
data.episodes.forEach((e,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1} · ${e.success?'Success':'Goal missed'}`;$('episodes').append(o)});
function stop(){if(timer!==null)clearInterval(timer);timer=null;$('play').textContent='Play'}
function setStep(n){step=Math.max(0,Math.min(n,data.episodes[episode].predicted.length-1));render()}
function render(){const e=data.episodes[episode],route=e.predicted,vp=route[step];$('step').max=route.length-1;$('step').value=step;$('counter').textContent=`${step+1} / ${route.length}`;$('previous').disabled=step===0;$('next').disabled=step===route.length-1;$('photo').src=e.images[vp][Number($('face').value)];$('instruction').textContent=e.instruction;$('model').textContent=`CLIP ViT-${data.model.toUpperCase()} · R2R validation unseen`;$('success').textContent=e.success?'Success':'Goal missed';$('error').textContent=e.navigation_error.toFixed(2)+' m';$('identity').textContent=`Instruction ${e.instr_id} · Scene ${e.scan}`;
const coords=Object.values(e.nodes),xs=coords.map(p=>p[0]),ys=coords.map(p=>p[1]),xmin=Math.min(...xs),ymin=Math.min(...ys),scale=Math.min(450/Math.max(1,Math.max(...xs)-xmin),280/Math.max(1,Math.max(...ys)-ymin));const xy=id=>[25+(e.nodes[id][0]-xmin)*scale,305-(e.nodes[id][1]-ymin)*scale];
const ns='http://www.w3.org/2000/svg',svg=$('map');svg.replaceChildren();function add(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n);return n}e.edges.forEach(([a,b])=>{const p=xy(a),q=xy(b);add('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#34473b','stroke-width':1})});
function path(ids,color,width,dash){add('polyline',{points:ids.map(x=>xy(x).join(',')).join(' '),fill:'none',stroke:color,'stroke-width':width,'stroke-dasharray':dash||'','stroke-linejoin':'round'})}path(e.reference,'#c7af7f',3,'5 4');path(route.slice(0,step+1),'#b2efa1',4);const goal=xy(e.reference.at(-1));add('circle',{cx:goal[0],cy:goal[1],r:7,fill:'none',stroke:'#c7af7f','stroke-width':2});const cur=xy(vp);add('circle',{cx:cur[0],cy:cur[1],r:6,fill:'#f28469'});
$('provenance').textContent=`Fresh checkpoint inference generated ${data.generated_utc}. This player replays the resulting predictions; playback runs offline. ${data.episodes.length} demonstration episodes, not a benchmark estimate. Success uses the R2R distance threshold of less than 3 m. Scene photographs are Matterport3D data; follow its data terms when sharing.`}
$('episodes').onchange=()=>{stop();episode=Number($('episodes').value);step=0;render()};$('face').onchange=render;$('step').oninput=()=>{stop();setStep(Number($('step').value))};$('previous').onclick=()=>{stop();setStep(step-1)};$('next').onclick=()=>{stop();setStep(step+1)};$('play').onclick=()=>{if(timer!==null){stop();return}if(step===data.episodes[episode].predicted.length-1)step=0;$('play').textContent='Pause';render();timer=setInterval(()=>{if(step>=data.episodes[episode].predicted.length-1){stop();return}setStep(step+1)},1100)};render();
</script></html>
